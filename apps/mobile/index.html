<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSH" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/boot-splash.css" />
    <title>DeepSeek Harness Mobile</title>
    <script>
      (function () {
        var dark = false
        try {
          var pref = localStorage.getItem('dsh.mobile.theme')
          dark = pref === 'dark'
            || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (error) {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        var root = document.documentElement
        if (dark) root.setAttribute('data-ds-dark-theme', '')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var color = dark ? '#151517' : '#ffffff'
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i += 1) metas[i].setAttribute('content', color)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="mobile-boot" data-dsh-boot>
        <div class="mobile-boot__card">
          <div class="mobile-boot__wordmark">HARNESS</div>
          <div class="mobile-boot__spinner" data-dsh-boot-spinner></div>
          <div class="mobile-boot__hint">Loading plugins…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
